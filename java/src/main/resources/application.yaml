spring:
  application:
    name: time-deposit
  docker:
    compose:
      start:
        # `./mvnw spring-boot:run` (or the main class from an IDE) starts only Postgres from compose.yaml. The app
        # service there is for `docker compose up` and would clash on port 8080. The Docker Compose support is
        # not in the jar and is skipped in tests, so this has no effect there.
        arguments:
          - postgres
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
      naming:
        # Keep the camelCase table and column names from the README (Spring's default would use snake_case).
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # The camelCase names only exist in Postgres when quoted.
        globally_quoted_identifiers: true
        jdbc:
          batch_size: 50
        order_updates: true
