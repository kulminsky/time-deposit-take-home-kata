name: Java build

on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    # Docker is available on ubuntu-latest, so the Testcontainers integration tests run here too.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      # Java 17 is the baseline of the project (local builds may use a newer JDK with release 17).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Unit tests, integration tests and package
        run: ./mvnw -B verify

      # The same `docker compose up` a reviewer runs without a JDK: the image builds and the API answers.
      - name: Docker Compose smoke test
        # --wait returns once the containers run, before the app listens; until then the port can reset the
        # connection instead of refusing it, so curl retries on every error, not only on a refused connection.
        run: |
          docker compose up --build --detach --wait
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/time-deposits \
            || { docker compose logs; exit 1; }
          docker compose down -v
